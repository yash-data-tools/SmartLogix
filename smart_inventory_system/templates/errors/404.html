{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}
{% block page_title %}Error 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="avatar-circle mx-auto mb-3 bg-secondary-subtle text-secondary" style="width: 80px; height: 80px; font-size: 2rem;">
        <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <h2 class="fw-bold mb-2">404 - Resource Not Found</h2>
    <p class="text-muted mb-4">The inventory item, page, or shipment you requested could not be located in our records.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="fa-solid fa-house me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
