<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account - SmartLogix Inventory System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Instant Dark Mode Init Script -->
    <script>
        (function() {
            try {
                const storedTheme = localStorage.getItem('smartlogix-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = storedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0b0f19 0%, #0f172a 50%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
        }
        .register-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            color: var(--text-primary);
        }
        .register-header {
            background-color: var(--chip-bg);
            padding: 1.75rem 2rem 1.25rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        .register-body {
            padding: 2rem;
        }
        .auth-theme-toggle {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .auth-theme-toggle:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<button class="auth-theme-toggle" id="authThemeToggle" type="button" aria-label="Toggle theme">
    <i class="fa-solid fa-moon"></i>
</button>

<div class="register-card">
    <div class="register-header">
        <h4 class="fw-bold mb-1">Create Account</h4>
        <p class="text-muted small mb-0">Join the SmartLogix Management Platform</p>
    </div>

    <div class="register-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="johndoe" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" name="role">
                        <option value="Shopkeeper">Shopkeeper</option>
                        <option value="Warehouse Staff">Warehouse Staff</option>
                        <option value="Manager">Warehouse Manager</option>
                        <option value="Admin">Administrator</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="john@company.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                <i class="fa-solid fa-user-plus me-2"></i>Register
            </button>
        </form>

        <div class="text-center small text-muted">
            Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const authThemeToggle = document.getElementById('authThemeToggle');
    function syncAuthThemeIcon(theme) {
        if (!authThemeToggle) return;
        const icon = authThemeToggle.querySelector('i');
        if (!icon) return;
        if (theme === 'dark') {
            icon.className = 'fa-solid fa-sun';
            authThemeToggle.style.color = '#fbbf24';
        } else {
            icon.className = 'fa-solid fa-moon';
            authThemeToggle.style.color = '#ffffff';
        }
    }

    const curTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    syncAuthThemeIcon(curTheme);

    if (authThemeToggle) {
        authThemeToggle.addEventListener('click', function() {
            const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            const newT = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newT);
            document.documentElement.setAttribute('data-theme', newT);
            try { localStorage.setItem('smartlogix-theme', newT); } catch(e) {}
            syncAuthThemeIcon(newT);
        });
    }
</script>
</body>
</html>
