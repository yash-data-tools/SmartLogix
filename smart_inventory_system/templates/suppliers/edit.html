{% extends "base.html" %}

{% block title %}Edit Supplier - {{ supplier.company_name }}{% endblock %}
{% block page_title %}Edit Supplier Details{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-1">Edit: {{ supplier.company_name }}</h4>
                <p class="text-muted small mb-0 font-monospace">Supplier Code: {{ supplier.supplier_code }}</p>
            </div>
            <a href="{{ url_for('suppliers.detail', supplier_id=supplier.id) }}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Profile
            </a>
        </div>

        <div class="card-modern">
            <div class="card-body-modern p-4">
                <form method="POST" action="{{ url_for('suppliers.edit', supplier_id=supplier.id) }}">
                    <div class="mb-3">
                        <label for="company_name" class="form-label">Company Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="company_name" name="company_name" value="{{ supplier.company_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Contact Person / Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ supplier.name }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ supplier.phone }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ supplier.email }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label">Address <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="address" name="address" rows="3" required>{{ supplier.address }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('suppliers.detail', supplier_id=supplier.id) }}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Update Supplier
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
