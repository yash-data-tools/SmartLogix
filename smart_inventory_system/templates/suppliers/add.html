{% extends "base.html" %}

{% block title %}Register Supplier{% endblock %}
{% block page_title %}Register New Supplier{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-1">Add Supplier / Vendor</h4>
                <p class="text-muted small mb-0">Record vendor company details, key contact person, phone, and address.</p>
            </div>
            <a href="{{ url_for('suppliers.index') }}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Directory
            </a>
        </div>

        <div class="card-modern">
            <div class="card-body-modern p-4">
                <form method="POST" action="{{ url_for('suppliers.add') }}">
                    <div class="mb-3">
                        <label for="company_name" class="form-label">Company Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="company_name" name="company_name" placeholder="e.g. Apex Semiconductor & Tech Corp" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Contact Person / Representative Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Apex Global Electronics" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="orders@company.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label">Physical / Warehouse Address <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="address" name="address" rows="3" placeholder="Street address, city, state, zip code..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('suppliers.index') }}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="fa-solid fa-check me-1"></i> Save Supplier
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
